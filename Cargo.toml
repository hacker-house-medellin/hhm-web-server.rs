[package]
name = "hhm-mash-web"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
hhm-persistence = { git = "https://github.com/hacker-house-medellin/hhm-lib-core.git", default-features = false, features = ["read-only"] }  # avenue 1: reads only, enforced by the compiler
ores-transport = { git = "https://github.com/ORESoftware/ores-transport.git", branch = "main" }  # TODO(DEN): pin to a rev once ores-transport is pushed
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
flags2env = { version = "0.1.0", git = "https://github.com/flags-2-env/flags-2-env", rev = "d7bad9ea7dfc657653368237e08903514cdca1ec" }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "=1.1.20", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tower-http = { version = "=0.7.1", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
maud = { version = "0.27", features = ["axum"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
