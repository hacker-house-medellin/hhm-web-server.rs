[identity]
service = "hhm-mash-web"
type_name = "RuntimeEnv"

[help]
url = "https://github.com/flags-2-env/flags-2-env"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["DATABASE_URL", "TURNSTILE_SECRET"]

[flags.help]
env = "CLI_HELP_REQUESTED"
long = "help"
short = "h"
type = "boolean"
default = false
help = "Print command-line help."

[flags.version]
env = "CLI_VERSION_REQUESTED"
long = "version"
short = "V"
type = "boolean"
default = false
help = "Print the server version."

[flags.host]
env = "HOST"
long = "host"
type = "string"
default = "0.0.0.0"
help = "Web listener host."

[flags.port]
env = "PORT"
long = "port"
short = "p"
type = "integer"
default = 8081
help = "Web listener port."

[flags.supabase-url]
env = "SUPABASE_URL"
long = "supabase-url"
type = "string"
help = "Credential-free Supabase project URL."

[flags.public-origin]
env = "PUBLIC_ORIGIN"
long = "public-origin"
type = "string"
default = "https://user.hhaus.org"
help = "Exact public origin used for request-origin validation."

[flags.shared-auth-base-url]
env = "SHARED_AUTH_BASE_URL"
long = "shared-auth-base-url"
type = "string"
help = "Private Shared Auth back-channel base URL."

[flags.shared-auth-browser-prefix]
env = "SHARED_AUTH_BROWSER_PREFIX"
long = "shared-auth-browser-prefix"
type = "string"
default = "/shared-auth-ui"
help = "Same-origin, allow-listed Shared Auth browser proxy prefix."

[flags.shared-auth-session-cookie-name]
env = "SHARED_AUTH_SESSION_COOKIE_NAME"
long = "shared-auth-session-cookie-name"
type = "string"
default = "__Host-hhaus-user"
help = "Host-only Shared Auth browser session cookie name."

[flags.shared-auth-provider]
env = "SHARED_AUTH_PROVIDER"
long = "shared-auth-provider"
type = "string"
default = "supabase"
help = "Expected credential provider provenance."

[flags.shared-auth-provider-tenant]
env = "SHARED_AUTH_PROVIDER_TENANT"
long = "shared-auth-provider-tenant"
type = "string"
help = "Expected provider project or pool identifier; never a product organization."

[flags.shared-auth-delegation-client-id]
env = "SHARED_AUTH_DELEGATION_CLIENT_ID"
long = "shared-auth-delegation-client-id"
type = "string"
default = "hhm-web"
help = "Registered Shared Auth delegation client."

[flags.shared-auth-api-audience]
env = "SHARED_AUTH_API_AUDIENCE"
long = "shared-auth-api-audience"
type = "string"
default = "hhm-api"
help = "Exact audience for short-lived HHM API delegation."

[flags.turnstile-site-key]
env = "TURNSTILE_SITE_KEY"
long = "turnstile-site-key"
type = "string"
help = "Public Cloudflare Turnstile widget site key."

[flags.turnstile-verify-url]
env = "TURNSTILE_VERIFY_URL"
long = "turnstile-verify-url"
type = "string"
default = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
help = "Turnstile server-side verification endpoint."

[flags.rust-log]
env = "RUST_LOG"
long = "rust-log"
type = "string"
default = "error"
help = "Tracing filter."
